[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogpick"
dynamic = ["version"]
description = "Lightweight Difference-of-Gaussians particle picking for cryo-ET tilt series"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mrcfile>=1.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dogpick = "dogpick.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dogpick.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
